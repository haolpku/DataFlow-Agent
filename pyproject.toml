[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-mm-agent"
version = "0.1.0"
description = "Multimodal agent runtime contracts and trajectory operators for DataFlow-MM."
readme = "README.md"
requires-python = ">=3.10, <4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "DataFlow-MM-Agent contributors"},
]
dependencies = [
    "open-dataflow-mm",
    "pandas",
    "Pillow",
    "jsonschema",
    "openai",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dataflow_mm_agent", "dataflow_mm_agent.*"]
